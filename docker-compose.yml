services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cursor_sync
      POSTGRES_PASSWORD: cursor_sync
      POSTGRES_DB: cursor_sync
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursor_sync -d cursor_sync"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgres://cursor_sync:cursor_sync@postgres:5432/cursor_sync
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: "8100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
