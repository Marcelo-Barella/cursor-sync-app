services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cursor_sync
      POSTGRES_PASSWORD: cursor_sync
      POSTGRES_DB: cursor_sync
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursor_sync -d cursor_sync"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgres://cursor_sync:cursor_sync@postgres:5432/cursor_sync
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: "8100"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
